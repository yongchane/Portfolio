name: Feature request
description: Propose a product or implementation change.
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
      placeholder: Describe the job-to-be-done.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
      placeholder: Describe the smallest useful version.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What must be true before this is done?
      placeholder: |
        - 
        - 
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Which checks or manual flows should validate this?
      placeholder: npm run lint, npm run typecheck, browser QA, etc.
