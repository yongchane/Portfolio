name: Bug report
description: Report broken behavior or a regression.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: What is happening now?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction Steps
      description: Give concrete steps, URL, account/state, and screenshots if useful.
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, network response, console error, screenshot, or failing test.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Portfolio
        - Ops console
        - Project canvas
        - Nest ops-api
        - Supabase
        - Deployment
        - Other
